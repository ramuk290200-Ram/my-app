<p>vehicle2 works!</p>
<input type="text" [(ngModel)]="term">
<button (click)="search()">search</button>


<table class="table table-dark table-bordered table-striped">


    <thead>
        <tr>
            <th>id</th>
            <th>vehicles</th>
            <th>manufacturer</th>
            <th>model</th>
            <th>type</th>
            <th (click)="sort('fuel')">fuel</th>
            <th (click)="sort('color')">color</th>
            <th>image</th>
            <th>cost</th>
            <th>tyres</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>

        <tr *ngFor="let vehicle of vehicles">

            <td>{{vehicle.id}}</td>
            <td>{{vehicle.vehicles }}</td>
            <td>{{vehicle.manufacturer }}</td>
            <td>{{vehicle.model}}</td>
            <td>{{vehicle.type}}</td>
            <td>{{vehicle.fuel}}</td>
            <td>{{vehicle.color}}</td>
           <td><img [src]="vehicle.image" width="10%" height="10%"></td>
            <td>{{vehicle.cost}}</td>
            <td>{{vehicle.tyres}}</td>


            <td>
                <button class="btn btn-danger">delete</button>


            </td>










        </tr>


    </tbody>
</table>
<button *ngFor="let x of [].constructor(10);let i= index" (click)="pageVehicles(i+1)">{{i+1}}</button>
