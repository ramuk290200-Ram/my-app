<p appColors>vehicles works!</p>
<input type="text" [(ngModel)]='term' placeholder="search">
<button class="btn btn-primary" (click)="filterVehicles()">search</button>



<table class="table table-dark table-boardered table-striped">


    <thead>
        <tr>
            <th>SNO</th>

            <th>vehicles</th>
            <th>manufacturer</th>
            <th>model</th>
            <th>type</th>
            <th (click)="sortVehicles('fuel')">fuel</th>
            <th (click)="sortVehicles('color')">color</th>
            <td>image</td>
            <th>cost</th>
            <th>tyres</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>

        <tr *ngFor="let vehicle of vehicles, let i=index">
            <td>{{i+1}}</td>

            
            <td>{{vehicle.Vehicle}}</td>
            <td appColors>{{vehicle.manufacturer | lowercase}}</td>
            <td>{{vehicle.model | uppercase}}</td>
            <td>{{vehicle.type}}</td>
            <td>{{vehicle.fuel}}</td>
            <td>{{vehicle.color}}</td>
            <td>{{vehicle.image}}</td>
            <td >{{vehicle.cost | rupees}}</td>
            <td>{{vehicle.tyres}}</td>
            <td>
                <button class="btn btn-primary" routerLink="/dashboard/view-vehicle/{{vehicle.id}}">view</button>
                <button (click)="deleteVehicle(vehicle.id)" class="btn btn-danger">delete</button>
                <button class="btn btn-warning" routerLink="/dashboard/edit-vehicle/{{vehicle.id}}">edit</button>
            </td>







        </tr>

    </tbody>
</table>
<button *ngFor="let x of [].constructor(10);let i=index" (click)="pagedVehicles(i+1)">{{i+1}}</button>
